name: CI

# Mirrors ./tools/verify.sh (see docs/BUILD.md) in three stages:
#
#   static-checks  the tools/check_*.py validators that cover what aapt2 and
#                  the unit tests cannot (resource cross-references, the
#                  all-inclusion data policy, Compose usage, generated files,
#                  widget layouts).
#   build          JVM unit tests + lint + assembleDebug + APK integrity
#                  (no unresolved ${applicationId}, startup provider merged,
#                  debug signature present).
#   emulator       connectedDebugAndroidTest plus the cold-launch / logcat
#                  crash smoke test from `verify.sh --device`, on the minSdk
#                  and targetSdk API levels.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The daemon adds nothing on an ephemeral runner and costs memory; the JVM
  # args mirror gradle.properties.
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.welcome=never

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resource cross-references
        run: python3 tools/check_res.py

      - name: Data export/import all-inclusion policy
        run: python3 tools/check_policy.py

      - name: Compose usage
        run: python3 tools/check_compose.py

      - name: Generated files in sync
        run: python3 tools/check_generated.py

      - name: Widget layouts
        run: python3 tools/check_widget.py

  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests (JVM)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      # The checks below are the reason the Gradle-less pipeline was removed
      # (docs/BUILD.md): an APK that links but leaves ${applicationId}
      # unresolved in the androidx.startup provider authority crashes at
      # launch. Fail the build here rather than on a device.
      - name: APK integrity
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "FATAL: APK not produced at $APK" >&2; exit 1; }
          echo "size:   $(stat -c%s "$APK") bytes"
          echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)"

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          AAPT2="$BUILD_TOOLS/aapt2"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          "$AAPT2" dump badging "$APK" | grep -E '^package:|application-label:' | head -3

          MANIFEST="$("$AAPT2" dump xmltree --file AndroidManifest.xml "$APK")"
          if echo "$MANIFEST" | grep -q 'applicationId'; then
            echo "FATAL: unresolved \${applicationId} placeholder in merged manifest" >&2
            exit 1
          fi
          if echo "$MANIFEST" | grep -q 'E: provider'; then
            echo "OK: merged manifest carries the androidx.startup InitializationProvider"
          else
            echo "FATAL: no <provider> in merged manifest (work-runtime AAR not merged)" >&2
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK" | head -5

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  emulator:
    name: Emulator verification (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # minSdk and targetSdk from app/build.gradle.kts.
        api-level: [26, 34]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # Hardware acceleration; without it the emulator boot times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated"

      - name: Instrumented tests + launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./tools/ci_emulator_verify.sh

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-reports-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
