# JVM options for the Gradle daemon.
#
# 2560m was not enough for `lintDebug`: on CI it ran for 26 minutes without
# finishing and was killed by the job timeout, which is what a GC-thrashing
# heap looks like from the outside. Lint holds the whole Compose UAST model in
# memory at once, so it is the peak consumer in this build — the unit tests and
# Kotlin compilation were always comfortable at the old size.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# AndroidX is required by every dependency in this app.
android.useAndroidX=true

# Non-transitive R classes (AGP 8 default, made explicit): each module's R
# only contains its own resources, so library attributes must be referenced
# through the owning library's R (e.g. androidx.appcompat.R.attr).
android.nonTransitiveRClass=true

# Build behaviour
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin
kotlin.code.style=official
